info:
  contact:
    name: Crow CI
    url: https://crowci.dev/
  description: |-
    Crow CI is a lightweight, community-driven CI application for self-hosted environments.
    To get a personal access token (PAT) for authentication, please log in
    and go to you personal profile page, by clicking the user icon at the top right.
  title: Crow CI API
paths:
  /admin/maintenance/config:
    get:
      description: Get the current database maintenance configuration
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/MaintenanceConfig'
      security:
        - ApiKeyAuth: []
      summary: Get maintenance configuration
      tags:
        - Admin
    put:
      consumes:
        - application/json
      description: Update the database maintenance configuration
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: Maintenance configuration
          in: body
          name: config
          required: true
          schema:
            $ref: '#/definitions/MaintenanceConfig'
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/MaintenanceConfig'
      security:
        - ApiKeyAuth: []
      summary: Update maintenance configuration
      tags:
        - Admin
  /admin/maintenance/config/{action}:
    get:
      description: Get maintenance configuration for a specific action (vacuum, kubernetes_cleanup)
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: Action type (vacuum, kubernetes_cleanup)
          enum:
            - vacuum
            - kubernetes_cleanup
          in: path
          name: action
          required: true
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/MaintenanceConfig'
      security:
        - ApiKeyAuth: []
      summary: Get maintenance configuration by action type
      tags:
        - Admin
    put:
      consumes:
        - application/json
      description: Update maintenance configuration for a specific action (vacuum,
        kubernetes_cleanup)
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: Action type (vacuum, kubernetes_cleanup)
          enum:
            - vacuum
            - kubernetes_cleanup
          in: path
          name: action
          required: true
          type: string
        - description: Maintenance configuration
          in: body
          name: config
          required: true
          schema:
            $ref: '#/definitions/MaintenanceConfig'
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/MaintenanceConfig'
      security:
        - ApiKeyAuth: []
      summary: Update maintenance configuration by action type
      tags:
        - Admin
  /admin/maintenance/logs:
    get:
      description: Get recent database maintenance logs
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - default: 50
          description: Number of logs to return
          in: query
          name: limit
          type: integer
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            items:
              $ref: '#/definitions/MaintenanceLog'
            type: array
      security:
        - ApiKeyAuth: []
      summary: Get maintenance logs
      tags:
        - Admin
  /admin/maintenance/run:
    post:
      consumes:
        - application/json
      description: Trigger database maintenance operation immediately
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: Maintenance job request
          in: body
          name: request
          required: true
          schema:
            $ref: '#/definitions/server_api.RunMaintenanceRequest'
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      security:
        - ApiKeyAuth: []
      summary: Run maintenance now
      tags:
        - Admin
  /admin/maintenance/stats:
    get:
      description: Get database maintenance statistics
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/MaintenanceStats'
      security:
        - ApiKeyAuth: []
      summary: Get maintenance statistics
      tags:
        - Admin
  /agents:
    get:
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - default: 1
          description: for response pagination, page offset number
          in: query
          name: page
          type: integer
        - default: 50
          description: for response pagination, max items per page
          in: query
          name: perPage
          type: integer
        - description: search in name, platform, backend, custom labels, ID
          in: query
          name: search
          type: string
        - description: filter by platform
          in: query
          name: platform
          type: string
        - description: filter by backend
          in: query
          name: backend
          type: string
        - default: id
          description: 'sort field: id, name, platform, backend, last_contact, capacity'
          in: query
          name: sort
          type: string
        - default: asc
          description: 'sort order: asc or desc'
          in: query
          name: order
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            items:
              $ref: '#/definitions/Agent'
            type: array
      summary: List agents
      tags:
        - Agents
    post:
      description: Creates a new agent with a random token
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: the agent's data (only 'name' and 'no_schedule' are read)
          in: body
          name: agent
          required: true
          schema:
            $ref: '#/definitions/Agent'
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Agent'
      summary: Create a new agent
      tags:
        - Agents
  /agents/{agent_id}:
    delete:
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: the agent's id
          in: path
          name: agent_id
          required: true
          type: integer
      produces:
        - text/plain
      responses:
        '200':
          description: OK
      summary: Delete an agent
      tags:
        - Agents
    get:
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: the agent's id
          in: path
          name: agent_id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Agent'
      summary: Get an agent
      tags:
        - Agents
    patch:
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: the agent's id
          in: path
          name: agent_id
          required: true
          type: integer
        - description: the agent's data
          in: body
          name: agentData
          required: true
          schema:
            $ref: '#/definitions/Agent'
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Agent'
      summary: Update an agent
      tags:
        - Agents
  /agents/{agent_id}/tasks:
    get:
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: the agent's id
          in: path
          name: agent_id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            items:
              $ref: '#/definitions/Task'
            type: array
      summary: List agent tasks
      tags:
        - Agents
  /autoscalers:
    get:
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - default: 1
          description: for response pagination, page offset number
          in: query
          name: page
          type: integer
        - default: 50
          description: for response pagination, max items per page
          in: query
          name: perPage
          type: integer
        - description: search in name, provider, region, ID
          in: query
          name: search
          type: string
        - description: filter by provider
          in: query
          name: provider
          type: string
        - description: filter by enabled status
          in: query
          name: enabled
          type: boolean
        - default: id
          description: 'sort field: id, name, provider, last_contact'
          in: query
          name: sort
          type: string
        - default: asc
          description: 'sort order: asc or desc'
          in: query
          name: order
          type: string
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            items:
              $ref: '#/definitions/Autoscaler'
            type: array
      summary: List autoscalers
      tags:
        - Autoscalers
    post:
      description: Creates a new autoscaler with a random token. Configuration is
        provided by the autoscaler upon registration.
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: the autoscaler's data (only name is required)
          in: body
          name: autoscaler
          required: true
          schema:
            $ref: '#/definitions/Autoscaler'
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/AutoscalerWithToken'
      summary: Create a new autoscaler
      tags:
        - Autoscalers
  /autoscalers/{autoscaler_id}:
    delete:
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: the autoscaler's id
          in: path
          name: autoscaler_id
          required: true
          type: integer
      produces:
        - text/plain
      responses:
        '204':
          description: No Content
      summary: Delete an autoscaler
      tags:
        - Autoscalers
    get:
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: the autoscaler's id
          in: path
          name: autoscaler_id
          required: true
          type: integer
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Autoscaler'
      summary: Get an autoscaler
      tags:
        - Autoscalers
    patch:
      parameters:
        - default: Bearer <personal access token>
          description: Insert your personal access token
          in: header
          name: Authorization
          required: true
          type: string
        - description: the autoscaler's id
          in: path
          name: autoscaler_id
          required: true
          type: integer
        - description: the autoscaler's data (only enabled can be updated)
          in: body
          name: autoscalerData
          required: true
          schema:
            $ref: '#/definitions/Autoscaler'
      produces:
        - application/json
      responses:
        '200':
          description: OK
          schema:
            $ref: '#/definitions/Autoscaler'
      summary: Update an autoscaler
      tags:
        - Autoscalers
  /autoscalers/{autoscaler_id}/heartbeat:
    post:
      description: Autoscalers send heartbeats to update their status and configuration
      parameters:
        - default: Bearer <autoscaler token>
          description: Insert autoscaler token
          in: header
          name: Authorization
          required: true
          type: string
        - description: the autoscaler's id
          in: path
          name: autoscaler_id
          required: true
          type: integer
        - description: heartbeat data with active_agents, pending_agents, version, and
            configuration
          in: body
          name: heartbeat
          required: true
          schema:
