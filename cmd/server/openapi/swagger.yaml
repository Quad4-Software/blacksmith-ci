      images:
        items:
          type: string
        type: array
      name:
        type: string
      org_id:
        type: integer
      org_name:
        type: string
      repo_id:
        type: integer
      repo_name:
        type: string
      scope_type:
        description: '"user", "org", "repo", or "global"'
        type: string
      source:
        type: string
      updated_at:
        type: integer
      value:
        type: string
    type: object
  StatusValue:
    enum:
      - skipped
      - pending
      - running
      - success
      - failure
      - killed
      - error
      - blocked
      - declined
      - created
    type: string
    x-enum-comments:
      StatusBlocked: waiting for approval
      StatusCreated: created / internal use only
      StatusDeclined: blocked and declined
      StatusError: error with the config / while parsing / some other system problem
      StatusFailure: failed to finish (exit code != 0)
      StatusKilled: killed by user
      StatusPending: pending to be executed
      StatusRunning: currently running
      StatusSkipped: skipped as another step failed
      StatusSuccess: successfully finished
    x-enum-descriptions:
      - skipped as another step failed
      - pending to be executed
      - currently running
      - successfully finished
      - failed to finish (exit code != 0)
      - killed by user
      - error with the config / while parsing / some other system problem
      - waiting for approval
      - blocked and declined
      - created / internal use only
    x-enum-varnames:
      - StatusSkipped
      - StatusPending
      - StatusRunning
      - StatusSuccess
      - StatusFailure
      - StatusKilled
      - StatusError
      - StatusBlocked
      - StatusDeclined
      - StatusCreated
  Step:
    properties:
      depends_on:
        items:
          type: string
        type: array
      error:
        type: string
      exit_code:
        type: integer
      finished:
        type: integer
      id:
        type: integer
      name:
        type: string
      pid:
        type: integer
      pipeline_id:
        type: integer
      ppid:
        type: integer
      started:
        type: integer
      state:
        $ref: '#/definitions/StatusValue'
      type:
        $ref: '#/definitions/StepType'
      uuid:
        type: string
    type: object
  StepType:
    enum:
      - clone
      - service
      - plugin
      - commands
      - cache
    type: string
    x-enum-varnames:
      - StepTypeClone
      - StepTypeService
      - StepTypePlugin
      - StepTypeCommands
      - StepTypeCache
  Task:
    properties:
      agent_id:
        type: integer
      dep_status:
        additionalProperties:
          $ref: '#/definitions/StatusValue'
        type: object
      dependencies:
        items:
          type: string
        type: array
      id:
        type: string
      labels:
        additionalProperties:
          type: string
        type: object
      name:
        type: string
      pid:
        type: integer
      pipeline_id:
        type: integer
      repo_id:
        type: integer
      run_on:
        items:
          type: string
        type: array
    type: object
  User:
    properties:
      admin:
        description: |-
          Admin indicates the user is a system administrator.

          NOTE: If the username is part of the WOODPECKER_ADMIN
          environment variable, this value will be set to true on login.
        type: boolean
      avatar_url:
        description: the avatar url for this user.
        type: string
      description:
        description: Description is a short bio or description for this user.
        type: string
      email:
        description: |-
          Email is the email address for this user.

          required: true
        type: string
      forge_id:
        type: integer
      id:
        description: |-
          the id for this user.

          required: true
        type: integer
      login:
        description: |-
          Login is the username for this user.

          required: true
        type: string
      org_id:
        description: OrgID is the of the user as model.Org.
        type: integer
      timezone:
        description: Timezone is the user's timezone (e.g., "America/New_York", "Europe/Berlin").
        type: string
    type: object
  WebhookEvent:
    enum:
