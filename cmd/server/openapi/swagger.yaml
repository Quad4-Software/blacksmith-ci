          a new(Agent) still enforce the OrgID check by default
        type: integer
      owner_id:
        type: integer
      platform:
        type: string
      priority:
        type: integer
      token:
        type: string
      updated:
        type: integer
      version:
        type: string
      workflow_polling_healthy:
        type: boolean
    type: object
  Autoscaler:
    properties:
      active_agents:
        type: integer
      agent_labels:
