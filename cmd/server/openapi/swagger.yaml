        type: boolean
    type: object
  MaintenanceStats:
    properties:
      created:
        type: integer
      id:
        type: integer
      last_run:
        type: string
      last_run_duration:
        description: Duration in milliseconds
        type: integer
      last_run_error:
        type: string
      last_run_success:
        type: boolean
      successful_runs:
        type: integer
      total_runs:
        type: integer
      updated:
        type: integer
    type: object
