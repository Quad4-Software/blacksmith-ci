      - pull_request
      - pull_request_closed
      - pull_request_edited
      - tag
      - release
      - deployment
      - cron
      - manual
    type: string
    x-enum-varnames:
      - EventPush
      - EventPull
      - EventPullClosed
      - EventPullEdited
      - EventTag
      - EventRelease
      - EventDeploy
      - EventCron
      - EventManual
