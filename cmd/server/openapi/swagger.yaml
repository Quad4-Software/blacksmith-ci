        type: integer
      id:
        type: integer
      last_used:
        type: integer
      name:
        type: string
      org_id:
        description: 0 = user-level
        type: integer
      repo_id:
        description: 0 = not repo-scoped
        type: integer
      scopes:
        items:
          type: string
        type: array
      updated_at:
        type: integer
      user_id:
        type: integer
    type: object
  Agent:
