      created:
        type: integer
      creator_id:
        type: integer
      id:
        type: integer
      name:
        type: string
      next_exec:
        type: integer
      repo_id:
        type: integer
      repo_name:
        type: string
      repo_owner:
        type: string
      schedule:
        description: "@weekly,\t3min, ..."
        type: string
    type: object
  codeberg_org_crowci_crow_v4_server_model.ForgeType:
    enum:
      - github
      - gitlab
      - gitea
      - forgejo
      - bitbucket
      - bitbucket-dc
      - addon
    type: string
    x-enum-varnames:
      - ForgeTypeGithub
      - ForgeTypeGitlab
      - ForgeTypeGitea
      - ForgeTypeForgejo
      - ForgeTypeBitbucket
      - ForgeTypeBitbucketDatacenter
      - ForgeTypeAddon
