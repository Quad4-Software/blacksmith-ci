          type: string
        type: object
      created:
        type: integer
      enabled:
        type: boolean
      id:
        type: integer
      instance_type:
        type: string
      last_contact:
        type: integer
      limit_cpu_quota:
        type: string
      limit_mem:
        type: string
      max_agents:
        type: integer
      min_agents:
        type: integer
      name:
        type: string
      org_id:
        type: integer
      owner_id:
        type: integer
      pending_agents:
        type: integer
      provider:
        type: string
      region:
        type: string
      updated:
        type: integer
      version:
        type: string
      workflows_per_agent:
        type: integer
    type: object
  AutoscalerWithToken:
    properties:
      active_agents:
        type: integer
      agent_labels:
        additionalProperties:
          type: string
        type: object
      created:
        type: integer
      enabled:
        type: boolean
      id:
        type: integer
      instance_type:
        type: string
      last_contact:
        type: integer
      limit_cpu_quota:
        type: string
      limit_mem:
        type: string
      max_agents:
        type: integer
      min_agents:
        type: integer
      name:
        type: string
      org_id:
        type: integer
      owner_id:
        type: integer
      pending_agents:
        type: integer
      provider:
        type: string
      region:
        type: string
      token:
        type: string
      updated:
        type: integer
      version:
        type: string
      workflows_per_agent:
        type: integer
    type: object
  Config:
    properties:
      data:
        items:
          type: integer
        type: array
      hash:
        type: string
      name:
        type: string
    type: object
  Cron:
    properties:
