version: '2'
run:
  relative-path-mode: cfg
  build-tags:
    - test
    - containers_image_openpgp
    - exclude_graphdriver_btrfs
    - exclude_graphdriver_devicemapper
linters:
  default: none
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - contextcheck
    - depguard
    - dogsled
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - forbidigo
    - forcetypeassert
    - gochecknoinits
    - gocritic
    - godot
    - goheader
    - gomoddirectives
    - gomodguard_v2
    - goprintffuncname
    - govet
    - importas
    - ineffassign
    - makezero
    - misspell
    - mnd
    - nolintlint
    - rowserrcheck
    - sqlclosecheck
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usetesting
    - wastedassign
    - whitespace
    - zerologlint
  settings:
    depguard:
      rules:
        agent:
          list-mode: lax
          files:
            - '${config-path}/agent/**/*.go'
            - '${config-path}/agent/*.go'
            - '${config-path}/cmd/agent/**/*.go'
            - '${config-path}/cmd/agent/*.go'
            - '!${config-path}/cli/admin/agent/*.go'
            - '!${config-path}/cli/admin/agent/**/*.go'
            - '!${config-path}/cli/org/agent/*.go'
            - '!${config-path}/cli/org/agent/**/*.go'
          deny:
            - pkg: codefloe.com/crowci/crow/v6/cli
            - pkg: codefloe.com/crowci/crow/v6/cmd/cli
            - pkg: codefloe.com/crowci/crow/v6/cmd/server
            - pkg: codefloe.com/crowci/crow/v6/server
            - pkg: codefloe.com/crowci/crow/v6/web
        cli:
          list-mode: lax
          files:
            - '**/cli/**/*.go'
            - '**/cli/*.go'
            - '**/cmd/cli/**/*.go'
            - '**/cmd/cli/*.go'
          deny:
            - pkg: codefloe.com/crowci/crow/v6/agent
            - pkg: codefloe.com/crowci/crow/v6/server
            - pkg: codefloe.com/crowci/crow/v6/cmd/agent
            - pkg: codefloe.com/crowci/crow/v6/cmd/server
            - pkg: codefloe.com/crowci/crow/v6/web
        crow-go:
          list-mode: lax
          files:
            - '**/crow-go/crow/**/*.go'
            - '**/crow-go/crow/*.go'
          deny:
            - pkg: codefloe.com/crowci/crow/v6/agent
            - pkg: codefloe.com/crowci/crow/v6/cli
            - pkg: codefloe.com/crowci/crow/v6/cmd
            - pkg: codefloe.com/crowci/crow/v6/pipeline
            - pkg: codefloe.com/crowci/crow/v6/server
            - pkg: codefloe.com/crowci/crow/v6/shared
            - pkg: codefloe.com/crowci/crow/v6/web
        pipeline:
          list-mode: lax
          files:
            - '**/pipeline/**/*.go'
            - '**/pipeline/*.go'
            - '!**/cli/pipeline/*.go'
            - '!**/cli/pipeline/**/*.go'
            - '!**/server/pipeline/*.go'
            - '!**/server/pipeline/**/*.go'
          deny:
            - pkg: codefloe.com/crowci/crow/v6/agent
            - pkg: codefloe.com/crowci/crow/v6/cli
            - pkg: codefloe.com/crowci/crow/v6/cmd
            - pkg: codefloe.com/crowci/crow/v6/server
            - pkg: codefloe.com/crowci/crow/v6/web
        server:
          list-mode: lax
          files:
            - '**/server/**/*.go'
            - '**/server/*.go'
            - '**/cmd/server/**/*.go'
            - '**/cmd/server/*.go'
            - '**/web/**/*.go'
            - '**/web/*.go'
          deny:
            - pkg: codefloe.com/crowci/crow/v6/agent
            - pkg: codefloe.com/crowci/crow/v6/cli
            - pkg: codefloe.com/crowci/crow/v6/cmd/agent
            - pkg: codefloe.com/crowci/crow/v6/cmd/cli
            - pkg: codefloe.com/crowci/crow/v6/crow-go/crow
        shared:
          list-mode: lax
          files:
            - '**/shared/**/*.go'
            - '**/shared/*.go'
            - '!**/pipeline/shared/*.go'
            - '!**/pipeline/shared/**/*.go'
          deny:
            - pkg: codefloe.com/crowci/crow/v6/agent
            - pkg: codefloe.com/crowci/crow/v6/cli
            - pkg: codefloe.com/crowci/crow/v6/cmd
            - pkg: codefloe.com/crowci/crow/v6/pipeline
            - pkg: codefloe.com/crowci/crow/v6/server
            - pkg: codefloe.com/crowci/crow/v6/web
    errorlint:
      errorf-multi: true
    forbidigo:
      forbid:
        - pattern: context\.WithCancel$
        - pattern: ^print.*$
        - pattern: panic
        - pattern: ^log.Fatal().*$
    godot:
      scope: toplevel
      exclude:
        - '^\s*cSpell:'
        - '^\s*TODO:'
      capital: true
      period: true
    misspell:
      locale: US
    mnd:
      ignored-numbers:
        - '0o600'
        - '0o660'
        - '0o644'
        - '0o755'
        - '0o700'
      ignored-functions:
        - make
        - time.*
        - strings.Split
        - callerName
        - random.GetRandomBytes
    revive:
      rules:
        - name: var-naming
          arguments:
            - []
            - []
            - - skipPackageNameChecks: true
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - mnd
        path: fixtures|cmd/agent/flags.go|cmd/server/flags.go|pipeline/backend/kubernetes/flags.go|_test.go
      # Huma handlers extract *gin.Context via ginCtx(ctx) which contextcheck treats as a
      # non-inherited context. This is a false positive — the gin context wraps the same request.
      - linters:
          - contextcheck
        path: server/api/
      # Multi-forge migration: deprecated User fields (ForgeID, ForgeRemoteID, AccessToken, RefreshToken, Expiry)
      # are still used for backward compatibility during the transition to the UserForge table.
      # TODO: Remove this exclusion after migration is complete and deprecated fields are removed.
      - linters:
          - staticcheck
        text: 'SA1019:.*is deprecated.*Use.*UserForge'
    paths:
      - third_party$
      - builtin$
      - examples$
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(codefloe.com/crowci/crow)
      custom-order: true
    gofmt:
      simplify: true
      rewrite-rules:
        - pattern: interface{}
          replacement: any
    gofumpt:
      extra-rules: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
