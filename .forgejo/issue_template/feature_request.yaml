# Credits to: https://github.com/vitejs/vite/blob/main/.github/ISSUE_TEMPLATE/feature_request.yml
name: "\U0001F680 Feature request"
description: Propose a new feature to be added
labels: ['type/feature']
title: 'feat: '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for your interest in the project and taking the time to fill out this feature report!
  - type: textarea
    id: feature-description
    attributes:
      label: Feature description
      description: 'As a user of Crow I want [goal / wish] so that [benefit].'
    validations:
      required: true
  - type: textarea
    id: suggested-solution
    attributes:
      label: Potential solution(s)
      description: 'In web-ui / config we could provide following functionality...'
    validations:
      required: true
