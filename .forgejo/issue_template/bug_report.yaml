# Credits to: https://github.com/vitejs/vite/blob/main/.github/ISSUE_TEMPLATE/bug_report.yml
name: "\U0001F41E Bug report"
description: Report an issue with Crow
labels: ['type/bug']
title: 'bug: '
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out this bug report!
  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which component of Crow is affected by the issue?
      multiple: true
      options:
        - server
        - agent
        - cli
        - web-ui
        - docs
    validations:
      required: true
  - type: textarea
    id: bug-description
    attributes:
      label: Describe the bug
      description: A clear and concise description of the issue.
      placeholder: Bug description
    validations:
      required: true
  - type: textarea
    id: version_info
    attributes:
      label: Version Info
      description: Version can be found in the "Info" tab of the settings
      render: shell
      placeholder: Crow version
    validations:
      required: true
