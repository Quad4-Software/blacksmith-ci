when:
  - event: tag

clone:
  git:
    image: codefloe.com/crow-plugins/clone:1.0.3
    settings:
      tags: true

depends_on:
  - version-dict
  - images

labels:
  agent: thumper

steps:
  - name: 'Check version type'
    image: reg.devxy.io/docker.io/library/alpine:3.23
    pull: true
    commands:
      - apk add --no-cache -q jq git
      # Extract version components (e.g., v4.5.0 -> major=4, minor=5, patch=0)
      - |
        VERSION=$(echo "${CI_COMMIT_TAG}" | sed 's/^v//')
        MAJOR=$(echo $VERSION | cut -d. -f1)
        MINOR=$(echo $VERSION | cut -d. -f2)
        PATCH=$(echo $VERSION | cut -d. -f3)
        echo "VERSION=$VERSION MAJOR=$MAJOR MINOR=$MINOR PATCH=$PATCH"

        # Check if this commit is on the default branch (main)
        git fetch origin ${CI_REPO_DEFAULT_BRANCH} --quiet
        if git merge-base --is-ancestor HEAD origin/${CI_REPO_DEFAULT_BRANCH} 2>/dev/null; then
          FROM_MAIN=true
        else
          FROM_MAIN=false
        fi
        echo "FROM_MAIN=$FROM_MAIN"

        # Check if this is a new minor/major version (patch == 0)
        if [ "$PATCH" = "0" ]; then
          echo "NEW_VERSION=true" >> .version-env
          echo "VERSION_SLUG=v$${MAJOR}-$${MINOR}" >> .version-env
          echo "VERSION_LABEL=v$${MAJOR}.$${MINOR}" >> .version-env
        else
          echo "NEW_VERSION=false" >> .version-env
        fi

        # For patch releases from backported branches, skip docs deployment
        if [ "$FROM_MAIN" = "false" ] && [ "$PATCH" != "0" ]; then
          echo "SKIP_DOCS=true" >> .version-env
          echo "Patch release from backported branch - skipping docs deployment"
        else
          echo "SKIP_DOCS=false" >> .version-env
        fi
        cat .version-env

  - name: 'Create new version (minor/major only)'
    image: reg.devxy.io/docker.io/oven/bun:1.3-alpine
    pull: true
    environment:
      crowci_bot_token:
        from_secret: crowci_bot_token
    commands:
      - |
        source .version-env
        if [ "$NEW_VERSION" != "true" ]; then
          echo "Patch release - skipping version directory creation"
          exit 0
        fi
        apk add --no-cache -q git jq
        git config --global user.email "admin@crowci.dev"
        git config --global user.name "crowci-bot"
        git remote set-url origin https://crowci-bot:$${crowci_bot_token}@codefloe.com/crowci/crow.git

        # Move .version-env before checkout (it's untracked and would block checkout)
        mv .version-env /tmp/.version-env

        # Fetch and checkout main branch (tag checkout may be outdated)
        git fetch origin ${CI_REPO_DEFAULT_BRANCH}
        git checkout -B ${CI_REPO_DEFAULT_BRANCH} origin/${CI_REPO_DEFAULT_BRANCH}

        # Restore .version-env
        cp /tmp/.version-env .version-env

        # Check if version already exists (idempotent)
        if [ -d "docs/src/content/docs/$${VERSION_SLUG}" ]; then
          echo "Version $${VERSION_SLUG} already exists - skipping"
          exit 0
        fi

        # Create new version directory from dev
        cp -r docs/src/content/docs/dev "docs/src/content/docs/$${VERSION_SLUG}"
        # Create version sidebar config
        cp docs/src/content/versions/dev.json "docs/src/content/versions/$${VERSION_SLUG}.json"

        # Update astro.config.mjs using sed (simpler than node for escaping)
        cd docs
        # Add new version to versions array (only if not already present)
        if ! grep -q "slug: '$${VERSION_SLUG}'" astro.config.mjs; then
          sed -i "s/versions: \[/versions: [\n            { slug: '$${VERSION_SLUG}', label: '$${VERSION_LABEL}' },/" astro.config.mjs
        fi
        # Update current version label
        sed -i "s/current: { label: '[^']*', redirect: 'root' }/current: { label: '$${VERSION_LABEL} (latest)', redirect: 'root' }/" astro.config.mjs
        # Update root index redirect to new version
        sed -i "s|url=/v[0-9]*-[0-9]*/|url=/$${VERSION_SLUG}/|g" src/content/docs/index.mdx
        sed -i "s|documentation](/v[0-9]*-[0-9]*/)|documentation](/$${VERSION_SLUG}/)|g" src/content/docs/index.mdx
        cd ..

        # Remove old versions, keeping only the 4 most recent (plus dev)
        KEEP_COUNT=4
        ALL_VERSIONS=$(ls -d docs/src/content/docs/v[0-9]*-[0-9]* | sed 's|.*/||' | sort -t- -k1.2,1n -k2,2n)
        TOTAL=$(echo "$ALL_VERSIONS" | wc -l)
        if [ "$TOTAL" -gt "$KEEP_COUNT" ]; then
          REMOVE_COUNT=$((TOTAL - KEEP_COUNT))
          OLD_VERSIONS=$(echo "$ALL_VERSIONS" | head -n $REMOVE_COUNT)
          for OLD in $OLD_VERSIONS; do
            echo "Removing old version: $OLD"
            rm -rf "docs/src/content/docs/$OLD"
            rm -f "docs/src/content/versions/$OLD.json"
            # Remove from astro.config.mjs versions array
            sed -i "/slug: '$OLD'/d" docs/astro.config.mjs
          done
        fi

        # Commit and push changes (skip if no changes)
        git add -A
        git diff --cached --quiet || git commit -m "docs: add version $${VERSION_LABEL}"
        git push origin ${CI_REPO_DEFAULT_BRANCH}

  - name: 'Build and deploy docs'
    image: reg.devxy.io/docker.io/oven/bun:1.3-alpine
    pull: true
    environment:
      crowci_bot_token:
        from_secret: crowci_bot_token
    commands:
      - |
        set -e

        source .version-env
        if [ "$SKIP_DOCS" = "true" ]; then
          echo "Skipping docs deployment for backported branch patch release"
          exit 0
        fi

        apk add --no-cache -q git

        # Build docs
        cd docs
        bun install --frozen-lockfile
        bun run build
        cd ..

        # Save build output before switching branches
        cp -r docs/dist /tmp/docs-dist

        # Configure git
        git config --global user.email "admin@crowci.dev"
        git config --global user.name "crowci-bot"
        git remote set-url origin "https://crowci-bot:$${crowci_bot_token}@codefloe.com/crowci/crow.git"

        # Deploy to pages branch (create if missing)
        rm -f .version-env
        if git fetch origin pages:pages 2>/dev/null; then
          git checkout pages
        else
          git checkout --orphan pages
          git reset --hard
        fi

        cp -r /tmp/docs-dist/* .
        echo "crowci.dev" > .domains
        git add -A
        git commit -m "[skip ci] Deploy docs ${CI_COMMIT_TAG}" || true
        git push origin pages
