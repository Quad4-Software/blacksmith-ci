when:
  - event: pull_request_merged

steps:
  backport:
    image: codefloe.com/pat-s/backporter:v0.2.0
    pull: true
    environment:
      FORGEJO_TOKEN:
        from_secret: crowci_bot_token
    commands:
      - git config --global --add safe.directory "$CI_WORKSPACE"
      - backporter backport --ci
