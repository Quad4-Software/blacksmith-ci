when:
  - event: tag

variables:
  - &golang_image 'reg.devxy.io/docker.io/library/golang:1.25-alpine'

clone:
  git:
    image: codeberg.org/crow-plugins/clone:1.0.2
    settings:
      tags: true

depends_on:
  - images

labels:
  agent: artemis

steps:
  vendor:
    image: *golang_image
    commands:
      - go mod vendor

  build-cli:
    image: *golang_image
    commands:
      - apk add --no-cache -q just git sqlite-dev libc-dev gcc g++ build-base musl-dev binutils binutils-gold zip
      - just release-cli

  build-macOS-agent:
    image: *golang_image
    commands:
      - apk add --no-cache -q just git sqlite-dev libc-dev gcc g++ build-base musl-dev binutils binutils-gold zip bash
      - PLATFORMS=darwin just release-agent

  changelog:
    image: reg.devxy.io/docker.io/thegeeklab/git-sv:2.0.9
    commands:
      - apk add --no-cache -q sed
      - git sv current-version
      - git sv release-notes -t ${CI_COMMIT_TAG} -o CHANGELOG.md
      - sed -i '1,2d' CHANGELOG.md #  remove version
      - cat CHANGELOG.md

  'Create release':
    image: reg.devxy.io/docker.io/woodpeckerci/plugin-release:0.2.6
    settings:
      note: CHANGELOG.md
      api_key:
        from_secret: codeberg_bot_token
      files:
        - dist/*.tar.gz
      title: ${CI_COMMIT_TAG}

  'Bump and push homebrew-tap':
    image: alpine:3.23
    environment:
      SSH_KEY:
        from_secret: crowci-bot-ssh-key
    commands:
      - |
        set -e
        apk add --no-cache -q curl jq git sed openssh

        # Determine if this is a major release (breaking change)
        VERSION=${CI_COMMIT_TAG#v}
        MINOR=$(echo $VERSION | cut -d. -f2)
        PATCH=$(echo $VERSION | cut -d. -f3)
        BREAKING=""; [ "$MINOR" = "0" ] && [ "$PATCH" = "0" ] && BREAKING="!"

        # Setup SSH
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan codeberg.org >> ~/.ssh/known_hosts 2>/dev/null

        # Clone, update, commit, and push
        rm -rf homebrew-tap
        git clone --depth 1 ssh://git@codeberg.org/crowci/homebrew-tap.git
        cd homebrew-tap
        curl -s -O "https://codeberg.org/crowci/crow/archive/refs/tags/${CI_COMMIT_TAG}.tar.gz"
        SHA256=$(sha256sum "${CI_COMMIT_TAG}.tar.gz" | cut -d' ' -f1)
        sed -i "s|url .*\.tar\.gz|url \"https://codeberg.org/crowci/crow/archive/refs/tags/${CI_COMMIT_TAG}.tar.gz|" Formula/crow.rb
        sed -i "s/sha256 \"[^\"]*\"/sha256 \"$SHA256\"/" Formula/crow.rb
        rm -f "${CI_COMMIT_TAG}.tar.gz"
        git config user.name "crowci-bot"
        git config user.email "admin@crowci.dev"
        git add -A
        git commit -m "chore${BREAKING}: bump version to ${CI_COMMIT_TAG}"
        git push origin main

  'Bump and push crowci/helm':
    image: alpine:3.23
    environment:
      SSH_KEY:
        from_secret: crowci-bot-ssh-key
    commands:
      - |
        set -e
        apk add --no-cache -q git sed openssh

        # Determine if this is a major release (breaking change)
        VERSION=${CI_COMMIT_TAG#v}
        MINOR=$(echo $VERSION | cut -d. -f2)
        PATCH=$(echo $VERSION | cut -d. -f3)
        BREAKING=""; [ "$MINOR" = "0" ] && [ "$PATCH" = "0" ] && BREAKING="!"

        # Setup SSH
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan codeberg.org >> ~/.ssh/known_hosts 2>/dev/null

        # Clone, update, commit, and push
        rm -rf helm
        git clone --depth 1 ssh://git@codeberg.org/crowci/helm.git
        cd helm
        sed -i "s/^appVersion: .*/appVersion: ${CI_COMMIT_TAG#v}/" charts/crow/Chart.yaml
        git config user.name "crowci-bot"
        git config user.email "admin@crowci.dev"
        git add -A
        git commit -m "chore${BREAKING}: bump version to ${CI_COMMIT_TAG}"
        git push origin main

  'Create release for crowci/helm':
    image: reg.devxy.io/docker.io/thegeeklab/git-sv:2.0.9
    environment:
      SSH_KEY:
        from_secret: crowci-bot-ssh-key
    commands:
      - apk add --no-cache -q git openssh
      - mkdir -p ~/.ssh && chmod 700 ~/.ssh
      - echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan codeberg.org >> ~/.ssh/known_hosts 2>/dev/null
      - rm -rf helm
      - git clone ssh://git@codeberg.org/crowci/helm.git
      - cd helm
      - eval $(ssh-agent -s)
      - ssh-add ~/.ssh/id_ed25519
      - git sv tag

  'Bump and push ansible-cicd':
    image: alpine:3.23
    environment:
      SSH_KEY:
        from_secret: devxy/ansible-cicd-deploy-key
    commands:
      - |
        set -e
        apk add --no-cache -q git sed openssh

        # Determine if this is a major release (breaking change)
        VERSION=${CI_COMMIT_TAG#v}
        MINOR=$(echo $VERSION | cut -d. -f2)
        PATCH=$(echo $VERSION | cut -d. -f3)
        BREAKING=""; [ "$MINOR" = "0" ] && [ "$PATCH" = "0" ] && BREAKING="!"

        # Setup SSH
        mkdir -p ~/.ssh && chmod 700 ~/.ssh
        echo "$SSH_KEY" > ~/.ssh/id_ed25519 && chmod 600 ~/.ssh/id_ed25519
        ssh-keyscan codefloe.com >> ~/.ssh/known_hosts 2>/dev/null

        # Clone, update, commit, and push
        rm -rf ansible-cicd
        git clone --depth 1 ssh://git@codefloe.com/devxy/ansible-cicd.git
        cd ansible-cicd
        sed -i "s/^crow_version: .*/crow_version: ${CI_COMMIT_TAG}/" roles/crowci/defaults/main.yml
        git config user.name "crowci-bot"
        git config user.email "admin@crowci.dev"
        git add -A
        git commit -m "chore${BREAKING}: bump version to ${CI_COMMIT_TAG}"
        git push origin main
