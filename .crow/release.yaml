when:
  - event: tag

variables:
  - &golang_image 'reg.devxy.io/docker.io/library/golang:1.26-alpine'

clone:
  git:
    image: codefloe.com/crow-plugins/clone:1.0.4
    settings:
      tags: true

depends_on:
  - images

labels:
  agent: thumper

steps:
  vendor:
    image: *golang_image
    commands:
      - go mod vendor

  source-tarball:
    image: *golang_image
    commands:
      - apk add --no-cache -q git
      - mkdir -p dist
      - git archive --format=tar.gz --prefix=crow/ -o dist/crow-src.tar.gz HEAD

  build-cli:
    image: *golang_image
    commands:
      - apk add --no-cache -q just git sqlite-dev libc-dev gcc g++ build-base musl-dev binutils binutils-gold zip
      - just release-cli

  build-macOS-agent:
    image: *golang_image
    commands:
      - apk add --no-cache -q just git sqlite-dev libc-dev gcc g++ build-base musl-dev binutils binutils-gold zip bash
      - PLATFORMS=darwin just release-agent

  build-windows-agent:
    image: *golang_image
    commands:
      - apk add --no-cache -q just git sqlite-dev libc-dev gcc g++ build-base musl-dev binutils binutils-gold zip bash
      - PLATFORMS=windows just release-agent

  changelog:
    image: reg.devxy.io/docker.io/thegeeklab/git-sv:2.1.2
    commands:
      - apk add --no-cache -q sed
      - git sv current-version
      - git sv release-notes -t ${CI_COMMIT_TAG} -o CHANGELOG.md
      - sed -i '1,2d' CHANGELOG.md #  remove version
      - cat CHANGELOG.md

  'Create release':
    image: reg.devxy.io/docker.io/woodpeckerci/plugin-release:0.3.1
    settings:
      note: CHANGELOG.md
      api_key:
        from_secret: crowci_bot_token
      files:
        - dist/*.tar.gz
        - dist/*.zip
      title: ${CI_COMMIT_TAG}
      overwrite: true

  'Bump external repositories':
    image: reg.devxy.io/docker.io/thegeeklab/git-sv:2.1.2
    environment:
      SSH_KEY:
        from_secret: crowci-bot-ssh-key
    commands:
      - apk add --no-cache -q curl git sed openssh py3-pip nodejs npm go
      - pip install --break-system-packages ansible-core ansible-doctor
      - npm install -g pnpm
      - go install github.com/norwoodj/helm-docs/cmd/helm-docs@v1.14.2
      - sh .crow/scripts/release-bump.sh
