when:
  - event: tag

variables:
  - &golang_image 'docker.io/golang:1.24-alpine'

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.6.1
    settings:
      tags: true

depends_on:
  - docker

steps:
  vendor:
    image: *golang_image
    commands:
      - go mod vendor

  build-cli:
    image: *golang_image
    commands:
      - apk add --no-cache -q just git sqlite-dev libc-dev gcc g++ build-base musl-dev binutils binutils-gold
      - just release-cli

  changelog:
    image: docker.io/thegeeklab/git-sv:1.0.12
    commands:
      - apk add --no-cache -q sed
      - git sv current-version
      - git sv release-notes -t ${CI_COMMIT_TAG:-dev} -o CHANGELOG.md
      - sed '1,2d' CHANGELOG.md > CHANGELOG.md # remove version
      - cat CHANGELOG.md
    when:
      event: tag

  'Create release':
    image: docker.io/woodpeckerci/plugin-release:0.2.4
    settings:
      note: CHANGELOG.md
      api_key:
        from_secret: codeberg_bot_token
      files:
        - dist/*.tar.gz
      title: ${CI_COMMIT_TAG}
    when:
      event: tag
