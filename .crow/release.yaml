when:
  - event: tag

clone:
  git:
    image: docker.io/woodpeckerci/plugin-git:2.6.0
    settings:
      tags: true

depends_on:
  - docker

steps:
  changelog:
    image: docker.io/thegeeklab/git-sv:1.0.10
    commands:
      - git sv current-version
      - git sv release-notes -t ${CI_COMMIT_TAG:-dev} -o CHANGELOG.md
      - cat CHANGELOG.md

  'Create release':
  image: docker.io/woodpeckerci/plugin-release:0.2.3
  settings:
    files:
      - CHANGELOG.md
    api_key:
      from_secret: codeberg_bot_token
