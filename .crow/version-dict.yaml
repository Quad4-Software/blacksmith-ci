when:
  - event: tag
  - event: deployment

clone:
  git:
    image: codefloe.com/crow-plugins/clone:1.2.1
    settings:
      branch: pages
      ref: pages
      depth: 0

labels:
  agent: thumper

steps:
  - name: 'Update dev version hash'
    image: reg.devxy.io/docker.io/library/alpine:3.24
    commands:
      - apk add --no-cache -q yq
      - |
        # Use the versions file from the pages checkout, or create a default if missing
        if [ ! -f crow-versions.json ]; then
          echo '[{"latest": "", "dev": "", "rc": ""}]' > crow-versions.json
        fi
      - yq -iP '.[0].dev = "dev-${CI_COMMIT_SHA:0:10}"' crow-versions.json
    when:
      - event: deployment

  # used by Crow to make checks for outdated versions
  - name: 'Update release version hash'
    image: reg.devxy.io/docker.io/library/alpine:3.24
    commands:
      - apk add --no-cache -q yq
      - |
        # Create default file if it doesn't exist (first run after migration)
        if [ ! -f crow-versions.json ]; then
          echo '[{"latest": "", "dev": "", "rc": ""}]' > crow-versions.json
        fi
      - |
        if echo "${CI_COMMIT_TAG}" | grep -q "\-rc"; then
          yq -iP '.[0].rc = "${CI_COMMIT_TAG}"' crow-versions.json
        else
          yq -iP '.[0].latest = "${CI_COMMIT_TAG}"' crow-versions.json
        fi
    when:
      - event: tag

  - name: 'Generate versions.json for CLI update check'
    image: reg.devxy.io/docker.io/library/alpine:3.24
    commands:
      - apk add --no-cache -q jq
      - |
        # Convert crow-versions.json to the format the CLI updater expects.
        # crow-versions.json: [{"latest": "v4.5.0", "dev": "dev-abc", "rc": "v4.6.0-rc1"}]
        # versions.json:      [{"version": "v4.5.0", "title": "v4.5.0", "aliases": ["latest"]}, ...]
        jq '[
          .[0] | to_entries[] | select(.value != "") |
          {version: .value, title: .value, aliases: [.key]}
        ]' crow-versions.json > versions.json
        cat versions.json

  - name: 'Push changes to branch'
    image: reg.devxy.io/docker.io/appleboy/drone-git-push:1.2.3
    settings:
      remote: ${CI_REPO_CLONE_SSH_URL}
      branch: pages
      commit: true
      force: true
      ssh_key:
        from_secret: crowci-bot-ssh-key
      commit_message: '[skip ci] Update version.json ${CI_COMMIT_SHA}'
      author_name: crowci-bot
      author_email: admin@crowci.dev

  # crowci.dev only redirects to docs.crowci.com, but released CLIs and web UIs
  # still fetch the version files from it, so they are served there directly.
  - name: 'Sync version files to crowci.dev'
    image: reg.devxy.io/docker.io/library/alpine:3.24
    environment:
      crowci_bot_token:
        from_secret: crowci_bot_token
    commands:
      - apk add --no-cache -q git
      - |
        set -e
        git clone -q --depth 1 -b pages "https://crowci-bot:$${crowci_bot_token}@codefloe.com/crowci/crowci.dev.git" /tmp/crowci-dev
        cp crow-versions.json versions.json /tmp/crowci-dev/
        cd /tmp/crowci-dev
        git config user.email "admin@crowci.dev"
        git config user.name "crowci-bot"
        git add crow-versions.json versions.json
        if git diff --cached --quiet; then
          echo "version files unchanged"
        else
          git commit -q -m "[skip ci] Sync version files ${CI_COMMIT_SHA:0:10}"
          git push -q origin pages
        fi
