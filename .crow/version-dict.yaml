when:
  - event: tag
  - event: deployment

steps:
  - name: Prepare
    image: alpine:3.21
    commands:
      - mkdir upload/

  - name: 'Update dev version hash'
    image: alpine:3.21
    commands:
      - apk add --no-cache -q yq curl
      - curl -sL https://crowci.dev/version.json -o upload/version.json
      - yq -iP '.dev = "dev-${CI_COMMIT_SHA:0:10}"' upload/version.json

  - name: 'Update release version hash'
    image: alpine:3.21
    commands:
      - apk add --no-cache -q yq
      - if [[ "${CI_COMMIT_TAG}" != *"rc"* ]] ; then yq -iP '.latest = "${CI_COMMIT_TAG}"' upload/version.json ; fi
      - yq -iP '.rc = "${CI_COMMIT_TAG}"' upload/version.json
    when:
      - event: tag

  - name: s3-sync
    image: plugins/s3:1.5.3
    settings:
      bucket: crow-docs-nbg1
      region: nbg1
      endpoint: https://nbg1.your-objectstorage.com
      access_key:
        from_secret: HETZNER_S3_ACCESS_KEY_NBG1
      secret_key:
        from_secret: HETZNER_S3_SECRET_KEY_NBG1
      source: upload/version.json
      strip_prefix: upload/
      target: /
