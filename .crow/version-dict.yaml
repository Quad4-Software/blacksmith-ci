when:
  - event: tag
  - event: deployment

clone:
  git:
    image: woodpeckerci/plugin-git:2.6.5
    settings:
      branch: gh-pages
      ref: gh-pages
      depth: 0

steps:
  - name: 'Update dev version hash'
    image: alpine:3.22
    commands:
      - apk add --no-cache -q yq curl
      - ls -la
      - curl -sL https://crowci.dev/versions.json -o versions.json
      - |
        yq -i '
          (.[] | select(.title == "dev") ).version = "dev-${CI_COMMIT_SHA:0:10}"
        ' versions.json

  - name: 'Update release version hash'
    image: alpine:3.22
    commands:
      - apk add --no-cache -q yq
      - if [[ "${CI_COMMIT_TAG}" != *"rc"* ]] ; then yq -iP '.latest = "${CI_COMMIT_TAG}"' versions.json ; fi
      - |
        yq -i '
          (.[] | select(.title == "dev") ).version = "dev-${CI_COMMIT_SHA:0:10}"
        ' versions.json
      - git status
    when:
      - event: tag

  - name: 'Push changes to branch'
    image: docker.io/appleboy/drone-git-push:1.1.1
    settings:
      remote: ${CI_REPO_CLONE_SSH_URL}
      branch: gh-pages
      commit: true
      force: true
      ssh_key:
        from_secret: crowci-bot-ssh-key
      commit_message: '[skip ci] Update version.json ${CI_COMMIT_SHA}'
      author_name: crowci-bot
      author_email: admin@crowci.dev
