when:
  - event: pull_request
  - event: push
    branch:
      - release/*

variables:
  - &node_image 'reg.devxy.io/docker.io/oven/bun:1.4-alpine'
  - &when
    path:
      # related config files
      - '.crow/web.yaml'
      # web source code
      - 'web/**'
      # api source code
      - 'server/api/**'

labels:
  agent: thumper

steps:
  install-dependencies:
    image: *node_image
    directory: web/
    commands:
      - bun install --frozen-lockfile
    when: *when

  prettier:
    depends_on:
      - install-dependencies
    image: *node_image
    commands:
      # Run the script directly: the .bin shim needs node, which this image lacks.
      - bun web/node_modules/prettier/bin/prettier.cjs --check .
    when: *when

  lint:
    depends_on:
      - install-dependencies
    image: *node_image
    directory: web/
    commands:
      - bun run lint
    when: *when

  typecheck:
    depends_on:
      - install-dependencies
    image: *node_image
    directory: web/
    commands:
      # FIXME: https://github.com/oven-sh/bun/issues/12153#issuecomment-2217275888
      - apk add -q --no-cache nodejs
      - bun run typecheck
    when: *when

  test:
    depends_on:
      - install-dependencies
    image: *node_image
    directory: web/
    commands:
      # FIXME: https://github.com/oven-sh/bun/issues/12153#issuecomment-2217275888
      - apk add -q --no-cache nodejs
      - bun run test
    when: *when
