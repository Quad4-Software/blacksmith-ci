when:
  - event: pull_request
  - event: push
    branch:
      - release/*

variables:
  - &node_image 'reg.devxy.io/docker.io/oven/bun:1.2-alpine'
  - &when
    path:
      # related config files
      - '.crow/web.yaml'
      # web source code
      - 'web/**'
      # api source code
      - 'server/api/**'

steps:
  install-dependencies:
    image: *node_image
    directory: web/
    commands:
      - bun install --frozen-lockfile
    when: *when

  prettier:
    depends_on:
      - install-dependencies
    image: reg.devxy.io/docker.io/woodpeckerci/plugin-prettier:1.3.1
    pull: true
    settings:
      plugins:
        - 'prettier-plugin-tailwindcss'
        - '@ianvs/prettier-plugin-sort-imports'
    when: *when

  lint:
    depends_on:
      - install-dependencies
    image: *node_image
    directory: web/
    commands:
      - bun run lint
    when: *when

  typecheck:
    depends_on:
      - install-dependencies
    image: *node_image
    directory: web/
    commands:
      # FIXME: https://github.com/oven-sh/bun/issues/12153#issuecomment-2217275888
      - apk add -q --no-cache nodejs
      - bun run typecheck
    when: *when

  test:
    depends_on:
      - install-dependencies
    image: *node_image
    directory: web/
    commands:
      # FIXME: https://github.com/oven-sh/bun/issues/12153#issuecomment-2217275888
      - apk add -q --no-cache nodejs
      - bun run test
    when: *when
