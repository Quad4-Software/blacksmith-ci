when:
  - event: pull_request
  - event: push
    branch:
      - release/*

variables:
  - &node_image 'docker.io/node:23-alpine'
  - &when
    path:
      # related config files
      - '.crow/web.yaml'
      # web source code
      - 'web/**'
      # api source code
      - 'server/api/**'

steps:
  install-dependencies:
    image: *node_image
    directory: web/
    commands:
      - corepack enable
      - pnpm install --frozen-lockfile
    when: *when

  prettier:
    depends_on:
      - install-dependencies
    image: docker.io/woodpeckerci/plugin-prettier:1.2.1
    pull: true
    settings:
      plugins:
        - 'prettier-plugin-tailwindcss'
        - '@ianvs/prettier-plugin-sort-imports'
    when: *when

  lint:
    depends_on:
      - install-dependencies
    image: *node_image
    directory: web/
    commands:
      - corepack enable
      - pnpm lint
    when: *when

  typecheck:
    depends_on:
      - install-dependencies
    image: *node_image
    directory: web/
    commands:
      - corepack enable
      - pnpm typecheck
    when: *when

  test:
    depends_on:
      - install-dependencies
    image: *node_image
    directory: web/
    commands:
      - corepack enable
      - pnpm test
    when: *when
