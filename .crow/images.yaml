variables:
  - &golang_image 'reg.devxy.io/docker.io/library/golang:1.27-alpine'
  - &node_image 'reg.devxy.io/docker.io/oven/bun:1.4-alpine'
  - &xgo_image 'reg.devxy.io/docker.io/techknowlogick/xgo:go-1.27.x'
  - &buildx_plugin 'codefloe.com/crow-plugins/docker-buildx:2.6.0'
  - &platforms_pr 'linux/amd64'
  - &platforms_alpine 'linux/arm/v7,linux/arm64/v8,linux/amd64,linux/ppc64le,linux/riscv64,linux/s390x'
  - build_args: &build_args
      CI_COMMIT_SHA: ${CI_COMMIT_SHA}
      CI_COMMIT_TAG: ${CI_COMMIT_TAG}

  # cspell:words netgo

  - publish_logins: &publish_logins
      - registry: https://codeberg.org
        username: crowci-bot
        password:
          from_secret: codeberg_bot_token
      - registry: https://codefloe.com
        username: crowci-bot
        password:
          from_secret: crowci_bot_token
  - &publish_repos_server 'codeberg.org/crowci/crow-server,codefloe.com/crowci/crow-server'
  - &publish_repos_agent 'codeberg.org/crowci/crow-agent,codefloe.com/crowci/crow-agent'
  - &publish_repos_cli 'codeberg.org/crowci/crow-cli,codefloe.com/crowci/crow-cli'
  - path:
      # web source code
      &when_path
      - 'web/**'
      # api source code
      - 'server/api/**'
      # go source code
      - '**/*.go'
      - 'go.*'
      # schema changes
      - 'pipeline/schema/**'
      # Containerfile changes
      - 'images/**'
      # pipeline config changes
      - '.crow/**'

when:
  - event: [pull_request, deployment, tag]

labels:
  agent: thumper

steps:
  vendor:
    image: *golang_image
    pull: true
    commands:
      - go mod vendor
    when:
      - event: pull_request
        evaluate: 'CI_COMMIT_PULL_REQUEST_LABELS contains "build_pr_images"'
      - event: pull_request
        path: *when_path
      - event: [tag, deployment]

  ###############
  # S e r v e r #
  ###############

  build-ui:
    image: *node_image
    directory: web/
    commands:
      # Remove any stale dist left in a reused workspace before rebuilding, so the
      # xgo cross-compile step embeds this run's UI and not a leftover bundle.
      - rm -rf dist
      - bun install --frozen-lockfile
      - bun run build
      - 'test -s dist/index.html || { echo "FATAL: dist/index.html missing after bun run build"; exit 1; }'
      # Log the embedded bundle hash; compare against cross-compile-server's log to
      # confirm the same dist is what xgo embeds.
      - sha256sum dist/index.html
    when:
      - event: pull_request
        evaluate: 'CI_COMMIT_PULL_REQUEST_LABELS contains "build_pr_images"'
      - event: pull_request
        path: *when_path
      - event: [tag, deployment]

  cross-compile-server-[pr]:
    depends_on:
      - vendor
      - build-ui
    image: *xgo_image
    pull: true
    commands:
      - apt update
      - apt install -y tree
      # install latest just; the xgo base (Ubuntu 24.04) only packages just 1.21, too old for the [working-directory] recipe attribute used in the Justfile
      - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/bin/
      - PLATFORMS='linux|arm64;linux|amd64' just cross-compile-server
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      TAGS: sqlite sqlite_unlock_notify netgo
    when:
      - event: pull_request
        evaluate: 'CI_COMMIT_PULL_REQUEST_LABELS contains "build_pr_images"'
      - event: pull_request
        path: *when_path

  cross-compile-server:
    depends_on:
      - vendor
      - build-ui
    image: *xgo_image
    pull: true
    commands:
      - apt update
      - apt install -y tree
      # install latest just; the xgo base (Ubuntu 24.04) only packages just 1.21, too old for the [working-directory] recipe attribute used in the Justfile
      - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/bin/
      - PLATFORMS='linux|arm/v7;linux|arm64/v8;linux|amd64;linux|ppc64le;linux|riscv64;linux|s390x' just cross-compile-server
    environment:
      GITHUB_TOKEN:
        from_secret: github_token
      TAGS: sqlite sqlite_unlock_notify netgo
    when:
      event: [tag, deployment]

  publish-server-[pr]:
    depends_on:
      - cross-compile-server-[pr]
    image: *buildx_plugin
    settings:
      repo: crowci/crow-server
      dockerfile: images/Containerfile.server.alpine.multiarch.rootless
      platforms: *platforms_pr
      tag: ['pull_${CI_COMMIT_PULL_REQUEST}', 'pull_${CI_COMMIT_PULL_REQUEST}']
      logins: *publish_logins
    when: &when-preview
      evaluate: 'CI_COMMIT_PULL_REQUEST_LABELS contains "build_pr_images"'
      event: pull_request

  build-server-[pr]:
    depends_on:
      - vendor
      - build-ui
      - cross-compile-server-[pr]
    image: *buildx_plugin
    settings:
      dry_run: true
      repo: crowci/crow-server
      dockerfile: images/Containerfile.server.alpine.multiarch.rootless
      platforms: *platforms_pr
      tag: pull_${CI_COMMIT_PULL_REQUEST}
    when: &when-dryrun
      - evaluate: 'not (CI_COMMIT_PULL_REQUEST_LABELS contains "build_pr_images")'
        event: pull_request
        path: *when_path

  publish-server-[dev]:
    depends_on:
      - cross-compile-server
    image: *buildx_plugin
    settings:
      repo: *publish_repos_server
      dockerfile: images/Containerfile.server.alpine.multiarch.rootless
      platforms: *platforms_alpine
      tag: [dev, 'dev-${CI_COMMIT_SHA:0:10}', dev, 'dev-${CI_COMMIT_SHA:0:10}']
      logins: *publish_logins
      build_args: *build_args
    when: &when-publish-dev
      event: deployment

  release-server:
    depends_on:
      - cross-compile-server
    image: *buildx_plugin
    settings:
      repo: *publish_repos_server
      dockerfile: images/Containerfile.server.alpine.multiarch.rootless
      platforms: *platforms_alpine
      tag:
        - '${CI_COMMIT_TAG%%.*}'
        - '${CI_COMMIT_TAG%.*}'
        - '${CI_COMMIT_TAG}'
      logins: *publish_logins
      build_args: *build_args
    when: &when-release
      event: tag

  #############
  # A g e n t #
  #############

  publish-agent-[pr]:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: crowci/crow-agent
      dockerfile: images/Containerfile.agent.alpine.multiarch
      platforms: *platforms_pr
      tag: ['pull_${CI_COMMIT_PULL_REQUEST}', 'pull_${CI_COMMIT_PULL_REQUEST}']
      build_args: *build_args
      logins: *publish_logins
    when: *when-preview

  build-agent-[pr]:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      dry_run: true
      repo: crowci/crow-agent
      dockerfile: images/Containerfile.agent.alpine.multiarch
      platforms: *platforms_pr
      tag: pull_${CI_COMMIT_PULL_REQUEST}
      build_args: *build_args
    when: *when-dryrun

  publish-agent-[dev]:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: *publish_repos_agent
      dockerfile: images/Containerfile.agent.alpine.multiarch
      platforms: *platforms_alpine
      tag: [dev, 'dev-${CI_COMMIT_SHA:0:10}', dev, 'dev-${CI_COMMIT_SHA:0:10}']
      logins: *publish_logins
      build_args: *build_args
    when: *when-publish-dev

  release-agent:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: *publish_repos_agent
      dockerfile: images/Containerfile.agent.alpine.multiarch
      platforms: *platforms_alpine
      tag:
        - '${CI_COMMIT_TAG%%.*}'
        - '${CI_COMMIT_TAG%.*}'
        - '${CI_COMMIT_TAG}'
      logins: *publish_logins
      build_args: *build_args
    when: *when-release

  #########
  # C L I #
  #########

  build-cli-[pr]:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      dry_run: true
      repo: crowci/crow-cli
      dockerfile: images/Containerfile.cli.alpine.multiarch.rootless
      platforms: *platforms_pr
      tag: pull_${CI_COMMIT_PULL_REQUEST}
      build_args: *build_args
    when: *when-dryrun

  publish-cli-[dev]:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: *publish_repos_cli
      dockerfile: images/Containerfile.cli.alpine.multiarch.rootless
      platforms: *platforms_alpine
      tag: [dev, 'dev-${CI_COMMIT_SHA:0:10}']
      logins: *publish_logins
      build_args: *build_args
    when: *when-publish-dev

  release-cli:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: *publish_repos_cli
      dockerfile: images/Containerfile.cli.alpine.multiarch.rootless
      platforms: *platforms_alpine
      tag: ['${CI_COMMIT_TAG%%.*}', '${CI_COMMIT_TAG%.*}', '${CI_COMMIT_TAG}']
      logins: *publish_logins
      build_args: *build_args
    when: *when-release
