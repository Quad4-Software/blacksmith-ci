variables:
  - &golang_image 'reg.devxy.io/docker.io/library/golang:1.25-alpine3.22'
  - &node_image 'reg.devxy.io/docker.io/oven/bun:1.3-alpine'
  - &xgo_image 'reg.devxy.io/docker.io/techknowlogick/xgo:go-1.25.x'
  - &buildx_plugin 'codeberg.org/crow-plugins/docker-buildx:1.1.1'
  - &platforms_release 'linux/arm/v6,linux/arm/v7,linux/arm64/v8,linux/386,linux/amd64,linux/ppc64le,linux/riscv64,linux/s390x,freebsd/arm64,freebsd/amd64,openbsd/arm64,openbsd/amd64'
  - &platforms_server 'linux/arm/v7,linux/arm64/v8,linux/amd64,linux/ppc64le,linux/riscv64'
  - &platforms_pr 'linux/amd64'
  - &platforms_alpine 'linux/arm/v6,linux/arm/v7,linux/arm64/v8,linux/amd64,linux/ppc64le'
  - &build_args 'CI_COMMIT_SHA=${CI_COMMIT_SHA},CI_COMMIT_TAG=${CI_COMMIT_TAG}'

  # cspell:words netgo

  - publish_logins: &publish_logins
      - registry: https://codeberg.org
        username: crowci-bot
        password:
          from_secret: codeberg_bot_token
  - &publish_repos_server 'codeberg.org/crowci/crow-server'
  - &publish_repos_agent 'codeberg.org/crowci/crow-agent'
  - &publish_repos_cli 'codeberg.org/crowci/crow-cli'
  - path:
      # web source code
      &when_path
      - 'web/**'
      # api source code
      - 'server/api/**'
      # go source code
      - '**/*.go'
      - 'go.*'
      # schema changes
      - 'pipeline/schema/**'
      # Containerfile changes
      - 'images/**'
      # pipeline config changes
      - '.crow/images.yaml'

when:
  - event: [pull_request, deployment, tag]

steps:
  vendor:
    image: *golang_image
    pull: true
    commands:
      - go mod vendor
    when:
      - event: pull_request
        evaluate: 'CI_COMMIT_PULL_REQUEST_LABELS contains "build_pr_images"'
      - event: pull_request
        path: *when_path
      - event: [tag, deployment]

  ###############
  # S e r v e r #
  ###############

  build-ui:
    image: *node_image
    directory: web/
    commands:
      - bun install --frozen-lockfile
      - bun run build
    when:
      - event: pull_request
        evaluate: 'CI_COMMIT_PULL_REQUEST_LABELS contains "build_pr_images"'
      - event: pull_request
        path: *when_path
      - event: [tag, deployment]

  cross-compile-server-[pr]:
    depends_on:
      - vendor
      - build-ui
    image: *xgo_image
    pull: true
    commands:
      - apt update
      - apt install -y tree
      # install just FIXME: 'apt install -y just' from Debian >= 13
      - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/bin/
      - PLATFORMS='linux|arm64;linux|amd64' just cross-compile-server
    environment:
      TAGS: sqlite sqlite_unlock_notify netgo
    when:
      - event: pull_request
        evaluate: 'CI_COMMIT_PULL_REQUEST_LABELS contains "build_pr_images"'
      - event: pull_request
        path: *when_path

  cross-compile-server:
    depends_on:
      - vendor
      - build-ui
    image: *xgo_image
    pull: true
    commands:
      - apt update
      - apt install -y tree
      # install just FIXME: 'apt install -y just' from Debian >= 13
      - curl --proto '=https' --tlsv1.2 -sSf https://just.systems/install.sh | bash -s -- --to /usr/bin/
      - PLATFORMS='linux|arm/v7;linux|arm64/v8;linux|amd64;linux|ppc64le;linux|riscv64' just cross-compile-server
    environment:
      TAGS: sqlite sqlite_unlock_notify netgo
    when:
      event: [tag, deployment]

  publish-server-alpine-[pr]:
    depends_on:
      - cross-compile-server-[pr]
    image: *buildx_plugin
    settings:
      repo: crowci/crow-server
      dockerfile: images/Containerfile.server.alpine.multiarch.rootless
      platforms: *platforms_pr
      tag: pull_${CI_COMMIT_PULL_REQUEST}-alpine
      logins: *publish_logins
    when: &when-preview
      evaluate: 'CI_COMMIT_PULL_REQUEST_LABELS contains "build_pr_images"'
      event: pull_request

  build-server-[pr]:
    depends_on:
      - vendor
      - build-ui
      - cross-compile-server-[pr]
    image: *buildx_plugin
    settings:
      dry_run: true
      repo: crowci/crow-server
      dockerfile: images/Containerfile.server.multiarch.rootless
      platforms: *platforms_pr
      tag: pull_${CI_COMMIT_PULL_REQUEST}
    when: &when-dryrun
      - evaluate: 'not (CI_COMMIT_PULL_REQUEST_LABELS contains "build_pr_images")'
        event: pull_request
        path: *when_path

  publish-server-[dev]:
    depends_on:
      - cross-compile-server
    image: *buildx_plugin
    settings:
      repo: *publish_repos_server
      dockerfile: images/Containerfile.server.multiarch.rootless
      platforms: *platforms_server
      tag: [dev, 'dev-${CI_COMMIT_SHA:0:10}']
      logins: *publish_logins
      build_args: *build_args
    when: &when-publish-dev
      event: deployment

  publish-server-alpine-[dev]:
    depends_on:
      - cross-compile-server
    image: *buildx_plugin
    settings:
      repo: *publish_repos_server
      dockerfile: images/Containerfile.server.alpine.multiarch.rootless
      platforms: *platforms_alpine
      tag: [dev-alpine, 'dev-${CI_COMMIT_SHA:0:10}-alpine']
      logins: *publish_logins
      build_args: *build_args
    when: *when-publish-dev

  release-server:
    depends_on:
      - cross-compile-server
    image: *buildx_plugin
    settings:
      repo: *publish_repos_server
      dockerfile: images/Containerfile.server.multiarch.rootless
      platforms: *platforms_server
      tag: ['${CI_COMMIT_TAG%%.*}', '${CI_COMMIT_TAG%.*}', '${CI_COMMIT_TAG}']
      logins: *publish_logins
      build_args: *build_args
    when: &when-release
      event: tag

  release-server-alpine:
    depends_on:
      - cross-compile-server
    image: *buildx_plugin
    settings:
      repo: *publish_repos_server
      dockerfile: images/Containerfile.server.alpine.multiarch.rootless
      platforms: *platforms_alpine
      tag: ['${CI_COMMIT_TAG%%.*}-alpine', '${CI_COMMIT_TAG%.*}-alpine', '${CI_COMMIT_TAG}-alpine']
      logins: *publish_logins
      build_args: *build_args
    when: *when-release

  #############
  # A g e n t #
  #############

  publish-agent-alpine-[pr]:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: crowci/crow-agent
      dockerfile: images/Containerfile.agent.alpine.multiarch
      platforms: *platforms_pr
      tag: pull_${CI_COMMIT_PULL_REQUEST}-alpine
      build_args: *build_args
      logins: *publish_logins
    when: *when-preview

  build-agent-[pr]:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      dry_run: true
      repo: crowci/crow-agent
      dockerfile: images/Containerfile.agent.multiarch
      platforms: *platforms_pr
      tag: pull_${CI_COMMIT_PULL_REQUEST}
      build_args: *build_args
    when: *when-dryrun

  publish-agent-[dev]:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: *publish_repos_agent
      dockerfile: images/Containerfile.agent.multiarch
      platforms: *platforms_release
      tag: [dev, 'dev-${CI_COMMIT_SHA:0:10}']
      logins: *publish_logins
      build_args: *build_args
    when: &when-publish-dev
      event: deployment

  publish-agent-alpine-[dev]:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: *publish_repos_agent
      dockerfile: images/Containerfile.agent.alpine.multiarch
      platforms: *platforms_alpine
      tag: [dev-alpine, 'dev-${CI_COMMIT_SHA:0:10}-alpine']
      logins: *publish_logins
      build_args: *build_args
    when: *when-publish-dev

  release-agent:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: *publish_repos_agent
      dockerfile: images/Containerfile.agent.multiarch
      platforms: *platforms_release
      tag: ['${CI_COMMIT_TAG%%.*}', '${CI_COMMIT_TAG%.*}', '${CI_COMMIT_TAG}']
      logins: *publish_logins
      build_args: *build_args
    when: *when-release

  release-agent-alpine:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: *publish_repos_agent
      dockerfile: images/Containerfile.agent.alpine.multiarch
      platforms: *platforms_alpine
      tag: ['${CI_COMMIT_TAG%%.*}-alpine', '${CI_COMMIT_TAG%.*}-alpine', '${CI_COMMIT_TAG}-alpine']
      logins: *publish_logins
      build_args: *build_args
    when: *when-release

  #########
  # C L I #
  #########

  build-cli-[pr]:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      dry_run: true
      repo: crowci/crow-cli
      dockerfile: images/Containerfile.cli.multiarch.rootless
      platforms: *platforms_pr
      tag: pull_${CI_COMMIT_PULL_REQUEST}
      build_args: *build_args
    when: *when-dryrun

  publish-cli-[dev]:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: *publish_repos_cli
      dockerfile: images/Containerfile.cli.multiarch.rootless
      platforms: *platforms_release
      tag: [dev, 'dev-${CI_COMMIT_SHA:0:10}']
      logins: *publish_logins
      build_args: *build_args
    when: *when-publish-dev

  publish-cli-alpine-[dev]:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: *publish_repos_cli
      dockerfile: images/Containerfile.cli.alpine.multiarch.rootless
      platforms: *platforms_alpine
      tag: [dev-alpine, 'dev-${CI_COMMIT_SHA:0:10}-alpine']
      logins: *publish_logins
      build_args: *build_args
    when: *when-publish-dev

  release-cli:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: *publish_repos_cli
      dockerfile: images/Containerfile.cli.multiarch.rootless
      platforms: *platforms_release
      tag: ['${CI_COMMIT_TAG%%.*}', '${CI_COMMIT_TAG%.*}', '${CI_COMMIT_TAG}']
      logins: *publish_logins
      build_args: *build_args
    when: *when-release

  release-cli-alpine:
    depends_on:
      - vendor
    image: *buildx_plugin
    settings:
      repo: *publish_repos_cli
      dockerfile: images/Containerfile.cli.alpine.multiarch.rootless
      platforms: *platforms_alpine
      tag: ['${CI_COMMIT_TAG%%.*}-alpine', '${CI_COMMIT_TAG%.*}-alpine', '${CI_COMMIT_TAG}-alpine']
      logins: *publish_logins
      build_args: *build_args
    when: *when-release
