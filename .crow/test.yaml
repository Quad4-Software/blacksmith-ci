variables:
  - &golang_image 'docker.io/golang:1.24-alpine'
  - &when
    - path: &when_path # related config files
        - '.crow/test.yaml'
        - '.golangci.yaml'
        # go source code
        - '**/*.go'
        - 'go.*'
        # schema changes
        - 'pipeline/schema/**'
      event: pull_request

when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path: *when_path

steps:
  vendor:
    image: *golang_image
    commands:
      - go mod vendor
    when:
      path:
        - <<: *when_path
        - '.crow/**'

  lint-pipeline:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - go run codeberg.org/crowci/crow/v3/cmd/cli lint
    environment:
      CROW_DISABLE_UPDATE_CHECK: true
      CROW_LINT_STRICT: true
      CROW_PLUGINS_TRUSTED_CLONE: docker.io/thegeeklab/wp-git-clone,docker.io/woodpeckerci/plugin-git
      CROW_PLUGINS_PRIVILEGED: 'docker.io/woodpeckerci/plugin-docker-buildx'
    when:
      - event: pull_request
        path:
          - '.crow/**'

  dummy-web:
    image: *golang_image
    commands:
      - mkdir -p web/dist/
      - echo "test" > web/dist/index.html
    when:
      - path: *when_path

  lint:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - apk add --no-cache -q just git sqlite-dev libc-dev gcc g++ build-base musl-dev binutils binutils-gold
      # FIXME: until v2 appears in golang-alpine image
      - wget -O- -nv https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh | sh -s v2.0.2 && mv ./bin/golangci-lint /bin/
      - just lint
    when: *when

  check-openapi:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - apk add --no-cache -q just git
      - 'just generate-openapi'
      - 'DIFF=$(git diff)'
      - '[ -n "$DIFF" ] && { echo "openapi not up to date, exec `just generate-openapi` and commit"; echo "$DIFF"; exit 1; } || true'
    when: *when

  lint-license-header:
    image: *golang_image
    commands:
      - go install github.com/google/addlicense@latest # cspell:words addlicense
      - 'addlicense -check -ignore "vendor/**" **/*.go'
    when: *when

  test:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - apk add --no-cache -q just git gcc musl-dev
      - just test-agent
      - just test-server
      - just test-cli
      - just test-lib
    when:
      - path: *when_path

  sqlite:
    depends_on:
      - vendor
    image: *golang_image
    environment:
      CROW_DATABASE_DRIVER: sqlite3
    commands:
      - apk add --no-cache -q just git gcc musl-dev
      - just test-server-datastore-coverage
    when:
      - path: *when_path

  postgres:
    depends_on:
      - vendor
    image: *golang_image
    environment:
      CROW_DATABASE_DRIVER: postgres
      CROW_DATABASE_DATASOURCE: 'host=postgres user=postgres dbname=postgres sslmode=disable' # cspell:disable-line
    commands:
      - apk add --no-cache -q just git gcc musl-dev
      - just test-server-datastore
    when: *when

  mysql:
    depends_on:
      - vendor
    image: *golang_image
    environment:
      CROW_DATABASE_DRIVER: mysql
      CROW_DATABASE_DATASOURCE: root@tcp(mysql:3306)/test?parseTime=true
    commands:
      - apk add --no-cache -q just git gcc musl-dev
      - just test-server-datastore
    when: *when

services:
  postgres:
    image: docker.io/postgres:17
    ports: ['5432']
    environment:
      POSTGRES_USER: postgres
      POSTGRES_HOST_AUTH_METHOD: trust
    when: *when

  mysql:
    image: docker.io/mysql:9.2.0
    ports: ['3306']
    environment:
      MYSQL_DATABASE: test
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    when: *when
