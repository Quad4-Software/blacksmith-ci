variables:
  - &golang_image 'reg.devxy.io/docker.io/library/golang:1.27-alpine'
  - &when
    - event: pull_request
  # Point the Go module, build and golangci-lint caches into the workspace so
  # the parallel steps share them and the `cache` section can carry them over
  # to the next run.
  - go_cache_env: &go_cache_env
      GOMODCACHE: ${CI_WORKSPACE}/.cache/go-mod
      GOCACHE: ${CI_WORKSPACE}/.cache/go-build
      GOLANGCI_LINT_CACHE: ${CI_WORKSPACE}/.cache/golangci-lint

labels:
  agent: thumper

when:
  - event: pull_request
  - event: push
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}
      - v4.*

# Keys are immutable, so a new cache is saved only when go.sum changes.
# Runs without an exact match start from the newest cache of their ref, the
# pull request's target branch or the default branch.
cache:
  - key: go-{{ arch }}-v2-{{ checksum "go.sum" }}
    restore_keys: ['go-{{ arch }}-v2-']
    paths:
      - .cache/go-mod
      - .cache/go-build
      - .cache/golangci-lint

steps:
  vendor:
    image: *golang_image
    environment: *go_cache_env
    commands:
      - go mod vendor

  lint-pipeline:
    depends_on:
      - vendor
    image: *golang_image
    commands:
      - go run codefloe.com/crowci/crow/v6/cmd/cli lint
    environment:
      <<: *go_cache_env
      CROW_DISABLE_UPDATE_CHECK: true
      CROW_LINT_STRICT: true
      CROW_PLUGINS_TRUSTED_CLONE: reg.devxy.io/docker.io/woodpeckerci/plugin-git,codefloe.com/crow-plugins/clone
      CROW_PLUGINS_PRIVILEGED: 'reg.devxy.io/docker.io/woodpeckerci/plugin-docker-buildx'
    when:
      - event: pull_request

  dummy-web:
    depends_on: []
    image: *golang_image
    commands:
      - mkdir -p web/dist/
      - echo "test" > web/dist/index.html

  lint:
    depends_on:
      - vendor
    image: *golang_image
    environment: *go_cache_env
    commands:
      - apk add --no-cache -q just git sqlite-dev libc-dev gcc g++ build-base musl-dev binutils binutils-gold linux-headers
      # using this instead of apk as it is always using the most recent go version - otherwise golangci-lint complains about a mismatch when a new go version is released
      # The install script is fetched at the release tag rather than HEAD, so a change
      # on golangci-lint's default branch cannot run here; it checks the binary
      # against the checksums published with that release.
      # renovate: datasource=github-releases depName=golangci/golangci-lint
      - GOLANGCI_LINT_VERSION=v2.15.0
      - wget -O- -nv "https://raw.githubusercontent.com/golangci/golangci-lint/$${GOLANGCI_LINT_VERSION}/install.sh" | sh -s -- -b /usr/local/bin "$${GOLANGCI_LINT_VERSION}"
      - golangci-lint run
    when: *when

  check-generate:
    depends_on:
      - vendor
    image: *golang_image
    environment: *go_cache_env
    commands:
      - apk add --no-cache -q just git curl unzip
      - 'just generate'
      - 'DIFF=$(git diff)'
      - '[ -n "$DIFF" ] && { echo "generated files not up to date, run just generate and commit"; echo "$DIFF"; exit 1; } || true'
    when: *when

  check-proto-compat:
    depends_on: []
    image: *golang_image
    commands:
      - apk add --no-cache -q git curl
      # renovate: datasource=github-releases depName=bufbuild/buf
      - BUF_VERSION=v1.74.0
      - curl -fsSL -o /usr/local/bin/buf "https://github.com/bufbuild/buf/releases/download/$${BUF_VERSION}/buf-Linux-$(uname -m)"
      - chmod +x /usr/local/bin/buf
      - git fetch -q --depth=1 "$${CI_REPO_CLONE_URL}" "$${CI_COMMIT_TARGET_BRANCH}"
      - .crow/scripts/check-proto-compat.sh FETCH_HEAD
    when: *when

  lint-license-header:
    depends_on: []
    image: *golang_image
    environment: *go_cache_env
    commands:
      - go install github.com/google/addlicense@v1.2.0 # cspell:words addlicense
      - 'addlicense -check -ignore "vendor/**" **/*.go'
    when: *when

  test:
    depends_on:
      - vendor
    image: *golang_image
    environment: *go_cache_env
    commands:
      - apk add --no-cache -q just git gcc musl-dev linux-headers
      - just test-agent
      - just test-server
      - just test-cli
      - just test-lib

  sqlite:
    depends_on:
      - vendor
    image: *golang_image
    environment:
      <<: *go_cache_env
      CROW_DATABASE_DRIVER: sqlite3
    commands:
      - apk add --no-cache -q just git gcc musl-dev
      - just test-server-datastore-coverage

  postgres:
    depends_on:
      - vendor
    image: *golang_image
    environment:
      <<: *go_cache_env
      CROW_DATABASE_DRIVER: postgres
      CROW_DATABASE_DATASOURCE: 'host=svc-postgres user=postgres password=postgres dbname=postgres sslmode=disable' # cspell:disable-line
    commands:
      - apk add --no-cache -q just git gcc musl-dev
      - just test-server-datastore
    when: *when

  mysql:
    depends_on:
      - vendor
    image: *golang_image
    environment:
      <<: *go_cache_env
      CROW_DATABASE_DRIVER: mysql
      CROW_DATABASE_DATASOURCE: root@tcp(svc-mysql:3306)/test?parseTime=true
    commands:
      - apk add --no-cache -q just git gcc musl-dev
      - just test-server-datastore
    when: *when

services:
  svc-postgres:
    image: reg.devxy.io/docker.io/library/postgres:18
    ports: ['5432']
    tmpfs:
      - /var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    when: *when

  svc-mysql:
    image: reg.devxy.io/docker.io/library/mysql:26
    ports: ['3306']
    tmpfs:
      - /var/lib/mysql
    environment:
      MYSQL_DATABASE: test
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    when: *when
