when:
  - event: manual
    evaluate: 'task == "windows-agent"'

variables:
  - &golang_image 'reg.devxy.io/docker.io/library/golang:1.26-alpine'

clone:
  git:
    image: codefloe.com/crow-plugins/clone:1.0.3

labels:
  agent: thumper

steps:
  vendor:
    image: *golang_image
    commands:
      - go mod vendor

  build-windows-agent:
    image: *golang_image
    commands:
      - apk add --no-cache -q just git sqlite-dev libc-dev gcc g++ build-base musl-dev binutils binutils-gold zip bash
      - PLATFORMS=windows just release-agent

  publish:
    image: reg.devxy.io/docker.io/woodpeckerci/plugin-release:0.3.1
    settings:
      api_key:
        from_secret: crowci_bot_token
      files:
        - dist/*.zip
      title: 'Windows agent (manual build)'
      tag: windows-agent-dev
      target: ${CI_COMMIT_SHA}
      overwrite: true
      prerelease: true
      note: |
        Pre-release artifact produced by the manual `windows-agent` workflow.
        Built from `${CI_COMMIT_SHA}` on `${CI_COMMIT_BRANCH}`.
        Used to bootstrap the crow-autoscaler Windows path before tag releases publish the binary themselves.
