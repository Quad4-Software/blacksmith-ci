when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  - name: editorconfig
    image: mstruebing/editorconfig-checker:v3.2.0
    depends_on: []

  - name: spellcheck
    image: docker.io/node:23-alpine
    depends_on: []
    commands:
      - corepack enable
      - pnpx cspell lint --no-progress --gitignore '{**,.*}/{*,.*}'
      - apk add --no-cache -U tree # busybox tree don't understand "-I"
      # cspell:disable-next-line
      - tree --gitignore -I 012_columns_rename_procs_to_steps.go -I versioned_docs -I '*opensource.svg'| pnpx cspell lint --no-progress stdin

  - name: prettier
    image: docker.io/woodpeckerci/plugin-prettier:1.3.0
    pull: true
    depends_on: []
    settings:
      plugins:
        - 'prettier-plugin-tailwindcss'
        - '@ianvs/prettier-plugin-sort-imports'

  - name: commitlint
    when:
      - event: pull_request
    image: commitlint/commitlint:19.8.0
    commands:
      - echo $${CI_COMMIT_PULL_REQUEST_TITLE} | commitlint
