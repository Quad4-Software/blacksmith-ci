when:
  - event: [pull_request, pull_request_edited]
  - event: push
    branch:
      - ${CI_REPO_DEFAULT_BRANCH}
      - v4.*

labels:
  agent: thumper

steps:
  - name: editorconfig
    image: reg.devxy.io/docker.io/mstruebing/editorconfig-checker:v3.11.3
    depends_on: []

  - name: prettier
    image: reg.devxy.io/docker.io/oven/bun:1.4-alpine
    depends_on: []
    commands:
      # Use the prettier pinned in web/package.json so CI and the pre-commit hook agree.
      - bun install --frozen-lockfile --cwd web
      # Run the script directly: the .bin shim needs node, which this image lacks.
      - bun web/node_modules/prettier/bin/prettier.cjs --check .

  - name: commitlint
    when:
      - event: pull_request
      - event: pull_request_edited
    image: reg.devxy.io/docker.io/commitlint/commitlint:21.2.3
    commands:
      - echo $${CI_COMMIT_PULL_REQUEST_TITLE} | commitlint
