when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path: ['docs/**', '.crow/docs.yaml']
  - event: [pull_request, pull_request_closed]
    path: ['docs/**', '.crow/docs.yaml']

labels:
  agent: artemis

steps:
  - name: 'Install dependencies'
    image: reg.devxy.io/docker.io/oven/bun:1.3-alpine
    commands:
      - cd docs && bun install --frozen-lockfile

  - name: 'Build docs'
    image: reg.devxy.io/docker.io/oven/bun:1.3-alpine
    commands:
      - cd docs && bun run build
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}

  - name: 'Deploy to Pages'
    image: reg.devxy.io/docker.io/thegeeklab/wp-git-clone:1.0.25
    environment:
      CODEBERG_BOT_TOKEN:
        from_secret: codeberg_bot_token
    commands:
      - git config --global user.email "admin@crowci.dev"
      - git config --global user.name "crowci-bot"
      - git remote set-url origin https://crowci-bot:$${CODEBERG_BOT_TOKEN}@codeberg.org/crowci/crow.git
      # Deploy to pages branch
      - git fetch origin pages:pages || git checkout --orphan pages
      - git checkout pages
      - rm -rf *
      - cp -r docs/dist/* .
      - echo "crowci.dev" > .domains
      - git add -A
      - git commit -m "[skip ci] Deploy docs ${CI_COMMIT_SHA:0:10}" || true
      - git push origin pages
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}

  - name: 'Build docs (PR)'
    image: reg.devxy.io/docker.io/oven/bun:1.3-alpine
    commands:
      - cd docs && bun install --frozen-lockfile
      - cd docs && bun run build
    when:
      - event: pull_request

  - name: 'PR docs preview'
    image: reg.devxy.io/docker.io/woodpeckerci/plugin-surge-preview:1.4.1
    settings:
      path: 'docs/dist/'
      surge_token:
        from_secret: surge_token
      forge_repo_token:
        from_secret: codeberg_bot_token
    failure: ignore
    when:
      - event: [pull_request, pull_request_closed]
