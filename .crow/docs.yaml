when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path: ['docs/**', '.crow/docs.yaml', 'mkdocs.yaml']
  - event: pull_request
    path: ['docs/**', '.crow/docs.yaml', 'mkdocs.yaml']
  - event: tag

steps:
  - name: 'Build docs'
    image: alpine:3.21
    commands:
      - apk add --no-cache -q git py3-pip cairo
      - python3 -m venv venv
      - source venv/bin/activate && pip3 install -r docs/requirements.txt
      - mkdocs build
      - mv site/domains site/.domains

  - name: s3-sync
    image: plugins/s3:1.5.2
    settings:
      bucket: crow-docs
      region: nbg1
      endpoint: https://nbg1.your-objectstorage.com
      access_key:
        from_secret: HETZNER_S3_ACCESS_KEY_NBG1
      secret_key:
        from_secret: HETZNER_S3_SECRET_KEY_NBG1
      source: site/**/*
      strip_prefix: site/
      target: /
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}

