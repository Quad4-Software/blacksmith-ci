when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path: ['docs/**', '.crow/docs.yaml', 'mkdocs.yaml']
  - event: pull_request
    path: ['docs/**', '.crow/docs.yaml', 'mkdocs.yaml']
  - event: tag

# we need a full clone to be able to push back to the repo
clone:
  git:
    image: docker.io/thegeeklab/wp-git-clone:1.0.16

steps:
  - name: 'Build docs'
    image: alpine:3.21
    environment:
      IS_CI: true
      MKDOCS_MATERIAL_VERSION: 9.6.11-insiders-4.53.16
      GH_TOKEN_MKDOCS_MATERIAL:
        from_secret: gh_token_mkdocs_material
      CODEBERG_BOT_TOKEN:
        from_secret: codeberg_bot_token
    commands:
      - apk add --no-cache -q git py3-pip cairo just fish go pngquant
      - python3 -m venv venv
      - git config --global user.email "admin@crowci.dev"
      - git config --global user.name "crowci-bot"
      - git remote set-url origin https://crowci-bot:$${CODEBERG_BOT_TOKEN}@codeberg.org/crowci/crow.git
      # build & deploy
      - just docs-venv
      - just docs-mike "deploy dev --push"
      - mv site/domains site/.domains
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}

  - name: 'Build docs (PR)'
    image: alpine:3.21
    environment:
      IS_CI: true
      MKDOCS_MATERIAL_VERSION: 9.6.11-insiders-4.53.16
      GH_TOKEN_MKDOCS_MATERIAL:
        from_secret: gh_token_mkdocs_material
      CODEBERG_BOT_TOKEN:
        from_secret: codeberg_bot_token
    commands:
      - apk add --no-cache -q git py3-pip cairo just fish go pngquant
      - python3 -m venv venv
      - git config --global user.email "admin@crowci.dev"
      - git config --global user.name "crowci-bot"
      - git remote set-url origin https://crowci-bot:$${CODEBERG_BOT_TOKEN}@codeberg.org/crowci/crow.git
      # build & deploy
      - just docs-venv
      - just docs-build
      - mv site/domains site/.domains
    when:
      - event: pull_request

  - name: 'Build docs (tag)'
    when:
      - event: tag
    image: alpine:3.21
    environment:
      IS_CI: true
      MKDOCS_MATERIAL_VERSION: 9.6.11-insiders-4.53.16
      GH_TOKEN_MKDOCS_MATERIAL:
        from_secret: gh_token_mkdocs_material
      CODEBERG_BOT_TOKEN:
        from_secret: codeberg_bot_token
    commands:
      - apk add --no-cache -q git py3-pip cairo just fish go pngquant
      - python3 -m venv venv
      - git config --global user.email "admin@crowci.dev"
      - git config --global user.name "crowci-bot"
      - git remote set-url origin https://crowci-bot:$${CODEBERG_BOT_TOKEN}@codeberg.org/crowci/crow.git
      # build & deploy
      - just docs-venv
      - just docs-mike "deploy --push --update-aliases --alias-type redirect $(echo ${CI_COMMIT_TAG#v} | cut -d. -f1,2) latest"
      - mv site/domains site/.domains

  - name: PR docs preview
    image: docker.io/woodpeckerci/plugin-surge-preview:1.3.5
    settings:
      path: 'site/'
      surge_token:
        from_secret: surge_token
      forge_repo_token:
        from_secret: codeberg_bot_token
    failure: ignore
    when:
      - event: [pull_request, pull_request_closed]

  - name: Clone gh-pages branch for S3 sync
    image: alpine:3.21
    commands:
      - apk add --no-cache -q git
      - git clone --branch gh-pages --depth 1 https://codeberg.org/crowci/crow docs_versioned
      - cd docs_versioned
      - git checkout gh-pages
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
      - event: tag

  - name: s3-sync
    image: woodpeckerci/plugin-s3:1.3.2
    settings:
      bucket: crow-docs-nbg1
      region: nbg1
      endpoint: https://nbg1.your-objectstorage.com
      access_key:
        from_secret: HETZNER_S3_ACCESS_KEY_NBG1
      secret_key:
        from_secret: HETZNER_S3_SECRET_KEY_NBG1
      source: docs_versioned/**/*
      strip_prefix: docs_versioned/
      target: /
      overwrite: true
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
      - event: tag
