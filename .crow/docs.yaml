when:
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
    path: ['docs/**', '.crow/docs.yaml', '.crow/docs-release.yaml']
  - event: [pull_request, pull_request_closed, pull_request_merged]
    path: ['docs/**', '.crow/docs.yaml']
  - event: manual
    evaluate: 'task == "docs"'

labels:
  agent: thumper

steps:
  - name: 'Build and deploy docs'
    image: reg.devxy.io/docker.io/oven/bun:1.4-alpine
    pull: true
    environment:
      crowci_bot_token:
        from_secret: crowci_bot_token
    commands:
      - |
        set -e
        apk add --no-cache -q git

        # Build docs
        cd docs
        bun install --frozen-lockfile
        bun run build
        cd ..

        # Save build output before switching branches
        cp -r docs/dist /tmp/docs-dist

        # Configure git
        git config --global user.email "admin@crowci.dev"
        git config --global user.name "crowci-bot"
        git remote set-url origin "https://crowci-bot:$${crowci_bot_token}@codefloe.com/crowci/crow.git"

        # Deploy to pages branch (create if missing), retrying on concurrent updates
        for attempt in 1 2 3 4 5; do
          if git fetch origin pages 2>/dev/null; then
            git checkout -B pages origin/pages
          else
            git checkout --orphan pages
            git reset --hard
          fi

          # Only the built site belongs on pages: drop the docs/ sources and
          # node_modules that earlier deploys committed by accident, and any
          # untracked build leftovers from the checkout we came from.
          git rm -rq --cached --ignore-unmatch docs
          git clean -ffdxq

          cp -r /tmp/docs-dist/* .
          echo "crowci.dev" > .domains
          git add -A
          git commit -m "[skip ci] Deploy docs ${CI_COMMIT_SHA:0:10}" || true

          if git push origin pages; then
            break
          fi
          if [ "$attempt" = "5" ]; then
            echo "Failed to push pages after $attempt attempts"
            exit 1
          fi
          echo "Push rejected (likely concurrent deploy), retrying ($attempt)..."
        done
    when:
      - event: push
        branch: ${CI_REPO_DEFAULT_BRANCH}
      - event: manual
        evaluate: 'task == "docs"'

  - name: 'Build docs (PR)'
    image: reg.devxy.io/docker.io/oven/bun:1.4-alpine
    pull: true
    commands:
      - cd docs && bun install --frozen-lockfile && bun run build
    when:
      - event: pull_request

  - name: 'PR docs preview'
    image: codefloe.com/crow-plugins/roost:0.12.1
    settings:
      server:
        from_secret: roost_server
      token:
        from_secret: roost_token
      comment_token:
        from_secret: crowci_bot_token
      dir: 'docs/dist'
      ttl: 168h
    failure: ignore
    when:
      - event: [pull_request, pull_request_closed, pull_request_merged]
