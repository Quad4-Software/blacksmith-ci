# Exercises the hyperv backend against real Hyper-V VMs.
#
# The rest of the test suite runs on Linux, where Hyper-V does not exist, so
# this is the only place the backend's end-to-end behavior is checked. The
# backend was written without access to a Windows host, and its first run
# here found bugs that no unit test could have caught.
#
# It needs an agent on a Windows host with the Hyper-V role, running the
# **local** backend, with a golden VHDX staged. The local backend and not the
# hyperv backend, for the same reason the macOS job runs on a local-backend
# agent: a workflow cannot drive the hypervisor from inside one of its own
# guests without nested virtualization, and nesting would not be testing the
# thing anyone runs.
#
# Manual-only until a matching agent exists.
#
# A workflow whose labels match no agent does not "skip": the scheduler cannot
# place it and the whole pipeline is held, so making this run on every pull
# request before the agent exists would block everyone else's work.
#
# The agent does not have to be a permanent machine. A second autoscaler
# instance with CROW_FILTER_LABELS=group=windows-hyperv idles at zero agents
# and provisions one only when this pipeline is triggered, which is the point
# of keeping the trigger manual. It needs a host offering nested
# virtualization: Azure Dv5/Ev5 or an AWS *.metal instance, never a B-series
# or a Hetzner/Linode/Scaleway/Vultr VM. See the backend docs for the
# provider matrix.
#
# The Azure side of that landed in crowci/autoscaler#181; the pool itself is
# deployed from crowci/infrastructure#109, whose bootstrap installs the
# Hyper-V role. Those hosts start empty, so the golden-image step below builds
# the base VHDX on first use, which adds about 7 minutes to a cold start.
#
# Once an agent is registered with `group=windows-hyperv`, this can move to
# pull_request and pushes to the default branch. Keep it advisory even then,
# with the `failure: ignore` already set on each step: one Windows host, whose
# jobs each cold-boot a guest, should not be a single point of failure for the
# pull request queue until it has proven stable. Cold boot is also why this is
# a poor fit for every push regardless of stability.

when:
  - event: manual

labels:
  group: windows-hyperv

variables:
  # Built by the golden-image step when the host does not have it yet, with
  # git in it and an administrator account matching the guest credentials
  # below.
  - &base_vhdx 'C:\crow-images\golden.vhdx'
  - &vm_path 'C:\crow-vms'
  # The NAT switch the network step creates, which gives guests outbound
  # access for the image build and the clone test.
  - &switch crow-nat
  # The Justfile's recipes and backtick variables are POSIX shell, and just
  # runs them with `sh`. Git for Windows ships one, but its installer only puts
  # git itself on PATH.
  - &posix_path "$env:PATH = 'C:\\Program Files\\Git\\usr\\bin;' + $env:PATH"

steps:
  unit:
    image: powershell
    failure: ignore
    commands:
      - go test ./pipeline/backend/hyperv/...

  # Parses the contrib scripts with the PowerShell that runs them. The
  # bootstrap is a Go template, so its template lines are replaced with a
  # comment first; the remaining template expressions all sit inside string
  # literals.
  scripts:
    depends_on: []
    image: powershell
    commands:
      - |
        $failed = $false
        foreach ($file in Get-ChildItem -Path contrib\hyperv -Filter *.ps1) {
          $text = Get-Content -LiteralPath $file.FullName -Raw
          $text = $text -replace '(?m)^\{\{.*\}\}\r?$', '# template line'
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseInput($text, [ref]$null, [ref]$errors) | Out-Null
          foreach ($e in $errors) {
            Write-Output "$($file.Name):$($e.Extent.StartLineNumber): $($e.Message)"
            $failed = $true
          }
        }
        if ($failed) { exit 1 }
        Write-Output 'all contrib scripts parse'

  # Idempotent, like everything the autoscaler bootstrap runs at boot, which
  # uses the same script.
  network:
    depends_on: []
    image: powershell
    commands:
      - .\contrib\hyperv\setup-nat-network.ps1 -SwitchName crow-nat

  # A host that already has the image, such as a permanent one, keeps it.
  # The step is not failure: ignore, since nothing after it can run without
  # the image.
  golden-image:
    depends_on:
      - network
    image: powershell
    environment:
      GOLDEN_VHDX: *base_vhdx
      GOLDEN_SWITCH: *switch
      GUEST_PASSWORD:
        from_secret: hyperv_guest_password
    commands:
      - |
        if (Test-Path -LiteralPath $env:GOLDEN_VHDX) {
          Write-Output "$env:GOLDEN_VHDX is already staged"
        } else {
          & .\contrib\hyperv\build-golden-image.ps1 -Path $env:GOLDEN_VHDX -Username crow `
            -Password (ConvertTo-SecureString $env:GUEST_PASSWORD -AsPlainText -Force) `
            -SwitchName $env:GOLDEN_SWITCH -SetupScript .\contrib\hyperv\guest-setup-git.ps1
        }

  # Everything below here is what the unit tests cannot reach: PowerShell
  # Direct, the Hyper-V cmdlets and the VM lifecycle.
  integration:
    depends_on:
      - unit
      - golden-image
    image: powershell
    failure: ignore
    environment:
      CROW_BACKEND_HYPERV_BASE_VHDX: *base_vhdx
      CROW_BACKEND_HYPERV_VM_PATH: *vm_path
      CROW_BACKEND_HYPERV_GUEST_USERNAME: crow
      CROW_BACKEND_HYPERV_GUEST_PASSWORD:
        from_secret: hyperv_guest_password
      CROW_BACKEND_HYPERV_SWITCH: *switch
      CROW_BACKEND_HYPERV_CPU: '4'
      CROW_BACKEND_HYPERV_MEMORY: 8Gi
      # One at a time: the host may be Standard-licensed, and the limit test
      # lowers this to 1 for itself anyway.
      CROW_BACKEND_HYPERV_MAX_VMS: '2'
    commands:
      - *posix_path
      - just test-hyperv-integration

  # The integration test drives the backend directly. This drives the whole
  # stack the way a user does, through the compiler and the pipeline runtime.
  crow-exec:
    depends_on:
      - integration
    image: powershell
    failure: ignore
    environment:
      CROW_BACKEND_HYPERV_BASE_VHDX: *base_vhdx
      CROW_BACKEND_HYPERV_VM_PATH: *vm_path
      CROW_BACKEND_HYPERV_GUEST_USERNAME: crow
      CROW_BACKEND_HYPERV_GUEST_PASSWORD:
        from_secret: hyperv_guest_password
      CROW_BACKEND_HYPERV_CPU: '4'
      CROW_BACKEND_HYPERV_MEMORY: 8Gi
      CROW_DISABLE_UPDATE_CHECK: 'true'
    commands:
      - *posix_path
      - just build-cli
      - New-Item -ItemType Directory -Force -Path .hyperv-e2e | Out-Null
      - |
        Set-Content -LiteralPath .hyperv-e2e\.crow.yaml -Encoding ASCII -Value @'
        when:
          - event: manual
        steps:
          # The hyperv backend runs every command step in the guest's
          # PowerShell and ignores the image, but the linter requires one.
          - name: writes
            image: powershell
            commands:
              - '[System.Environment]::OSVersion.Version.ToString()'
              - Set-Content -LiteralPath shared-file -Value marker
          - name: reads
            image: powershell
            commands:
              - Get-Content -LiteralPath shared-file
        '@
      - cd .hyperv-e2e
      - ..\dist\crow.exe exec --backend-engine hyperv .crow.yaml

  # A leaked VM holds a differencing disk and, because the cap is a license,
  # one of the slots the host is allowed to run. A failing test that also
  # leaves guests behind would quietly break every later run on this agent.
  cleanup:
    depends_on:
      - crow-exec
    image: powershell
    when:
      - status: [success, failure]
    commands:
      - |
        $leaked = @(Get-VM | Where-Object { $_.Name -like 'crow-*' })
        foreach ($vm in $leaked) {
          Write-Output "removing leaked VM $($vm.Name)"
          Stop-VM -Name $vm.Name -TurnOff -Force -ErrorAction SilentlyContinue
          Remove-VM -Name $vm.Name -Force -ErrorAction SilentlyContinue
        }
        Remove-Item -Path 'C:\crow-vms\crow-*.vhdx' -Force -ErrorAction SilentlyContinue
        if ($leaked.Count -gt 0) {
          throw "$($leaked.Count) VM(s) outlived the tests; the backend's teardown is not reclaiming them"
        }
